[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dt-ramde-v11"
version = "0.1.0.dev0"
description = "Contract-first DT-RAMDE v1.1 correctness implementation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Meng Zhou", email = "zhoumeng@cuc.edu.cn" },
  { name = "Danting Duan", email = "dantingduan.cn@gmail.com" },
]
requires-python = "==3.12.*"
dependencies = [
  "numpy==1.26.4",
]

[project.urls]
Repository = "https://github.com/zhoumeng-creater/weight"

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "ruff==0.9.4",
]
qualification = [
  "jsonschema==4.23.0",
  "pandas==2.2.2",
  "scipy==1.14.0",
]
benchmark = [
  "jmetalpy==1.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchmark_adapters = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
